<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Zen Hush</title>
    <style>
      body {
        font: 13px -apple-system, system-ui, sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #eee;
        background: #1c1c1e;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 10px;
      }
      section {
        margin-bottom: 14px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 6px;
      }
      .times {
        display: flex;
        gap: 8px;
        margin-left: 22px;
      }
      input[type="time"] {
        background: #2c2c2e;
        border: 1px solid #3a3a3c;
        color: #eee;
        border-radius: 6px;
        padding: 2px 4px;
      }
      button {
        width: 100%;
        padding: 6px;
        border-radius: 6px;
        border: none;
        background: #3a3a3c;
        color: #eee;
        cursor: pointer;
      }
      button:hover {
        background: #48484a;
      }
      ul {
        list-style: none;
        padding: 0;
        margin: 8px 0 0;
        max-height: 100px;
        overflow-y: auto;
      }
      li {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 3px 0;
      }
      li button {
        width: auto;
        padding: 1px 6px;
        font-size: 11px;
      }
      hr {
        border: none;
        border-top: 1px solid #3a3a3c;
        margin: 12px 0;
      }
    </style>
  </head>
  <body>
    <h1>Zen Hush</h1>

    <section>
      <label>
        <input type="checkbox" id="dndEnabled" />
        Scheduled Do Not Disturb
      </label>
      <div class="times">
        <label>From <input type="time" id="dndStart" /></label>
        <label>To <input type="time" id="dndEnd" /></label>
      </div>
    </section>

    <hr />

    <section>
      <button id="muteCurrent">Mute this site</button>
      <ul id="mutedList"></ul>
    </section>

    <script src="options.js"></script>
  </body>
</html>
