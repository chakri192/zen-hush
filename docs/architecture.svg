<svg xmlns="http://www.w3.org/2000/svg" width="880" height="490" viewBox="0 0 880 490" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#6b7688"/></marker>
    <marker id="ac" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#5fd0de"/></marker>
    <marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#7ddc8b"/></marker>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7.5" refY="3" orient="auto"><path d="M0,0 L7.5,3 L0,6 z" fill="#f2707c"/></marker>
  </defs>

  <rect width="880" height="490" rx="10" fill="#0b0d11"/>
  <rect x="0.5" y="0.5" width="879" height="489" rx="10" fill="none" stroke="#2b313d"/>

  <text x="28" y="38" font-size="13" font-weight="700" fill="#8a9bb4" letter-spacing="1.3">THREE WORLDS, BECAUSE ONLY ONE CAN SEE EACH THING</text>

  <!-- ── MAIN world ── -->
  <rect x="28" y="62" width="252" height="176" rx="10" fill="#12151b" stroke="#5fd0de" stroke-width="1.3"/>
  <rect x="42" y="54" width="106" height="16" fill="#0b0d11"/>
  <text x="50" y="66" font-size="10.5" font-weight="700" fill="#5fd0de">MAIN world</text>
  <text x="46" y="90" font-size="10" font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">inject.js</text>
  <text x="46" y="108" font-size="10" fill="#8a9bb4">the page's own JS context</text>
  <line x1="46" y1="118" x2="262" y2="118" stroke="#2b313d"/>
  <text x="46" y="138" font-size="10" fill="#8a9bb4">replaces window.Notification with</text>
  <text x="46" y="152" font-size="10" fill="#8a9bb4">a class of the same shape</text>
  <text x="46" y="174" font-size="9.5" fill="#7d8899">✓ can reach the page's globals</text>
  <text x="46" y="190" font-size="9.5" fill="#f2707c">✗ cannot touch browser.*</text>
  <rect x="46" y="200" width="216" height="26" rx="5" fill="#0f1319" stroke="#39414f"/>
  <text x="56" y="217" font-size="9" fill="#7d8899">suppressed calls return an inert stub</text>

  <!-- ── isolated world ── -->
  <rect x="316" y="62" width="232" height="176" rx="10" fill="#12151b" stroke="#a78bfa" stroke-width="1.3"/>
  <rect x="330" y="54" width="118" height="16" fill="#0b0d11"/>
  <text x="338" y="66" font-size="10.5" font-weight="700" fill="#a78bfa">isolated world</text>
  <text x="334" y="90" font-size="10" font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">bridge.js</text>
  <text x="334" y="108" font-size="10" fill="#8a9bb4">17 lines, and nothing else</text>
  <line x1="334" y1="118" x2="530" y2="118" stroke="#2b313d"/>
  <text x="334" y="138" font-size="10" fill="#8a9bb4">relays between the page and</text>
  <text x="334" y="152" font-size="10" fill="#8a9bb4">the extension. That's the job.</text>
  <text x="334" y="174" font-size="9.5" fill="#f2707c">✗ cannot see page globals</text>
  <text x="334" y="190" font-size="9.5" fill="#7d8899">✓ full browser.* access</text>
  <rect x="334" y="200" width="196" height="26" rx="5" fill="#0f1319" stroke="#39414f"/>
  <text x="344" y="217" font-size="9" fill="#7d8899">it exists purely to close that gap</text>

  <!-- ── background ── -->
  <rect x="584" y="62" width="268" height="176" rx="10" fill="#12151b" stroke="#7ddc8b" stroke-width="1.3"/>
  <rect x="598" y="54" width="102" height="16" fill="#0b0d11"/>
  <text x="606" y="66" font-size="10.5" font-weight="700" fill="#7ddc8b">background</text>
  <text x="602" y="90" font-size="10" font-family="SFMono-Regular,Menlo,monospace" fill="#e6edf3">background.js</text>
  <text x="602" y="108" font-size="10" fill="#8a9bb4">the only place settings live</text>
  <line x1="602" y1="118" x2="834" y2="118" stroke="#2b313d"/>
  <text x="602" y="138" font-size="10" fill="#8a9bb4">answers one question:</text>
  <text x="602" y="153" font-size="10" font-style="italic" fill="#7ddc8b">is this host silenced right now?</text>
  <text x="602" y="176" font-size="9.5" fill="#7d8899">· quiet hours, wrapping past midnight</text>
  <text x="602" y="192" font-size="9.5" fill="#7d8899">· the muted-hosts list</text>
  <rect x="602" y="202" width="232" height="24" rx="5" fill="#0f1319" stroke="#39414f"/>
  <text x="612" y="218" font-size="9" font-family="SFMono-Regular,Menlo,monospace" fill="#7d8899">→ { dndActive, muted }</text>

  <!-- arrows between lanes -->
  <path d="M280 132 L312 132" stroke="#5fd0de" stroke-width="1.4" marker-end="url(#ac)"/>
  <text x="296" y="124" font-size="8.5" fill="#5fd0de" text-anchor="middle">postMessage</text>
  <path d="M548 132 L580 132" stroke="#a78bfa" stroke-width="1.4" marker-end="url(#a)"/>
  <text x="564" y="124" font-size="8.5" fill="#a78bfa" text-anchor="middle">sendMessage</text>

  <path d="M580 172 L552 172" stroke="#7ddc8b" stroke-width="1.4" marker-end="url(#ag)"/>
  <path d="M312 172 L284 172" stroke="#7ddc8b" stroke-width="1.4" marker-end="url(#ag)"/>
  <text x="564" y="165" font-size="8.5" fill="#7ddc8b" text-anchor="middle">rules</text>
  <text x="296" y="165" font-size="8.5" fill="#7ddc8b" text-anchor="middle">rules</text>

  <!-- ── the race ── -->
  <line x1="28" y1="262" x2="852" y2="262" stroke="#2b313d"/>
  <text x="28" y="288" font-size="12" font-weight="700" fill="#8a9bb4" letter-spacing="1.1">THE GAP THAT LEAKED — AND HOW IT'S CLOSED</text>
  <text x="28" y="308" font-size="10" fill="#8a9bb4">Fetching the rules is asynchronous. A page that fires a notification at document_start does it before the answer comes back.</text>

  <line x1="60" y1="366" x2="820" y2="366" stroke="#39414f" stroke-width="1.5"/>

  <circle cx="150" cy="366" r="5" fill="#f2707c"/>
  <line x1="150" y1="366" x2="150" y2="336" stroke="#f2707c" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="150" y="330" font-size="10" font-weight="700" fill="#f2707c" text-anchor="middle">page fires one</text>
  <text x="150" y="390" font-size="9.5" fill="#8a9bb4" text-anchor="middle">rules not loaded yet</text>

  <rect x="200" y="352" width="230" height="28" rx="5" fill="#12151b" stroke="#f0b866" stroke-width="1.2"/>
  <text x="315" y="370" font-size="10" font-weight="700" fill="#f0b866" text-anchor="middle">parked in pending[ ]</text>
  <text x="315" y="398" font-size="9.5" fill="#8a9bb4" text-anchor="middle">caller gets a stub back, so nothing throws</text>

  <circle cx="500" cy="366" r="5" fill="#7ddc8b"/>
  <line x1="500" y1="366" x2="500" y2="336" stroke="#7ddc8b" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="500" y="330" font-size="10" font-weight="700" fill="#7ddc8b" text-anchor="middle">rules arrive</text>

  <path d="M512 366 L590 342" stroke="#7ddc8b" stroke-width="1.4" fill="none" marker-end="url(#ag)"/>
  <path d="M512 366 L590 392" stroke="#f2707c" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>

  <rect x="598" y="326" width="222" height="32" rx="6" fill="#12151b" stroke="#7ddc8b" stroke-width="1.2"/>
  <text x="709" y="346" font-size="10" fill="#7ddc8b" text-anchor="middle">allowed → fire it now, for real</text>

  <rect x="598" y="376" width="222" height="32" rx="6" fill="#12151b" stroke="#f2707c" stroke-width="1.2"/>
  <text x="709" y="396" font-size="10" fill="#f2707c" text-anchor="middle">silenced → drop it, never shown</text>

  <text x="28" y="440" font-size="9.5" fill="#7d8899">Without the parking step, anything fired in that sub-second window escaped the filter entirely — the one bug that made the extension</text>
  <text x="28" y="454" font-size="9.5" fill="#7d8899">feel unreliable rather than broken. A notification closed while parked is dropped on flush too, so late-cancelled ones don't resurface.</text>

  <line x1="28" y1="466" x2="852" y2="466" stroke="#2b313d"/>
  <text x="852" y="482" font-size="9.5" font-family="SFMono-Regular,Menlo,monospace" fill="#5d6675" text-anchor="end">MV3 · Firefox/Zen 115+ · ~220 lines</text>
</svg>
